name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A hang must fail LOUDLY and fast, not sit burning runner time until the
    # 6h default -- a job stuck at "in_progress" reads as "not done yet"
    # rather than "broken", which is how a false green gets merged.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.11" -- cover the floor and a current minor.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run test suite
        # tests/test_integration.py self-gates on a live-server health
        # check (pytest.mark.skipif) and skips automatically when no
        # llama-server/Ollama-compatible instance is reachable at
        # localhost:8080 -- true on a fresh CI runner, so no extra
        # deselection is needed here.
        run: uv run pytest -q
